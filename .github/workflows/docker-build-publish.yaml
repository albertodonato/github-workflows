name: Build and publish Docker images

on:
  workflow_call:
    inputs:
      image-name:
        type: string
        description: Image name on GHCR.io
        required: true
      target:
        type: string
        description: Target image to build
        required: false
      platforms:
        type: string
        description: Comma-separated list of platforms for the image
        required: true
      dockerhub-image-name:
        type: string
        description: Image name on Docker Hub
        required: true
      dockerhub-username:
        type: string
        description: Username for Docker Hub
        required: true
      suffix:
        type: string
        description: Image suffix
        required: false
      latest:
        type: bool
        description: Whether to tag the image as latest
        default: true

    secrets:
      DOCKERHUB_TOKEN:
        description: Token for Docker Hub
        required: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      SUFFIX: ${{ inputs.suffix != '' && format('-{0}', inputs.suffix) || '' }}
      REGISTRY: ghcr.io
      IS_MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}

    steps:
      - name: Repository checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.IS_TAG == 'true'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ inputs.dockerhub-username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ inputs.image-name }}
            ${{ env.IS_TAG == 'true' && format('{0}/{1}', inputs.dockerhub-username, inputs.dockerhub-image-name) || '' }}
          tags: |
            type=ref,event=branch,suffix=${{ env.SUFFIX }}
            type=ref,event=pr,prefix=pr-,suffix=${{ env.SUFFIX }}
            type=ref,event=tag,suffix=${{ env.SUFFIX }}
            type=semver,pattern={{major}},suffix=${{ env.SUFFIX }},enable=${{ env.IS_TAG == 'true' }}
            type=sha,prefix=sha-,suffix=${{ env.SUFFIX }},enable=${{ env.IS_TAG == 'false' }}
            type=raw,value=latest,suffix=${{ env.SUFFIX }},enable=${{ env.IS_MAIN_PUSH == 'true' || env.IS_TAG == 'true' }}
          flavor: |
            latest=false

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: ${{ inputs.target }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
