name: Build and publish Docker images

on:
  workflow_call:
    inputs:
      image-name:
        type: string
        description: Image name on GHCR.io
        required: true
      target:
        type: string
        description: Target image to build
        required: false
      platforms:
        type: string
        description: Comma-separated list of platforms for the image
        required: true
      dockerhub-image-name:
        type: string
        description: Image name on Docker Hub
        required: true
      dockerhub-username:
        type: string
        description: Username for Docker Hub
        required: true
      suffix:
        type: string
        description: Image suffix
        required: false
    secrets:
      DOCKERHUB_TOKEN:
        description: Token for Docker Hub
        required: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      SUFFIX: ${{ inputs.suffix != '' && format('-{0}', inputs.suffix) || '' }}
      REGISTRY: ghcr.io
      IS_MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}

    steps:
      - name: Repository checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.IS_TAG == 'true'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ inputs.dockerhub-username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ inputs.image-name }}
            ${{ env.IS_TAG == 'true' && format('{0}/{1}', inputs.dockerhub-username, inputs.dockerhub-image-name) || '' }}
          tags: |
            type=ref,event=branch,suffix=${{ env.SUFFIX }}
            type=ref,event=pr,prefix=pr-,suffix=${{ env.SUFFIX }}
            type=ref,event=tag,suffix=${{ env.SUFFIX }}
            type=semver,pattern={{major}},suffix=${{ env.SUFFIX }},enable=${{ env.IS_TAG == 'true' }}
            type=sha,prefix=sha-,suffix=${{ env.SUFFIX }},enable=${{ env.IS_TAG == 'false' }}
            type=raw,value=latest,suffix=${{ env.SUFFIX }},enable=${{ env.IS_MAIN_PUSH == 'true' || env.IS_TAG == 'true' }}
          flavor: |
            latest=false

      - name: Build and push
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          target: ${{ inputs.target }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
